<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI KP 玩家</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1 id="title">AI KP</h1>
    <span id="me" class="muted"></span>
    <span id="status" class="badge">连接中…</span>
  </header>
  <p id="notice" class="notice" hidden></p>

  <main class="layout play">
    <section class="col center">
      <ol id="log" class="log"></ol>
      <form id="message-form" class="composer">
        <select id="msg-kind">
          <option value="auto">自动判断</option>
          <option value="action">行动</option>
          <option value="dialogue">对话</option>
          <option value="ooc">题外话</option>
        </select>
        <textarea id="msg-text" rows="2" placeholder="说点什么，或描述你的行动…（Ctrl+Enter 发送）" required></textarea>
        <button id="send" type="submit">发送</button>
      </form>
    </section>

    <aside class="col right">
      <section id="story-box" hidden>
        <h3>故事简介</h3>
        <div id="story"></div>
      </section>
      <section>
        <h3>当前</h3>
        <div id="state" class="muted">—</div>
      </section>
      <section>
        <h3>前情提要</h3>
        <div id="summaries" class="muted">尚无</div>
      </section>
      <section>
        <h3>我的角色卡</h3>
        <p id="sheet-hint" class="muted small"></p>
        <textarea id="sheet" rows="8" spellcheck="false"></textarea>
        <div class="row">
          <button id="sheet-example" type="button">填入示例</button>
          <button id="sheet-save" type="button">保存角色卡</button>
        </div>
      </section>
    </aside>
  </main>
  <script src="/play.js" type="module"></script>
</body>
</html>
