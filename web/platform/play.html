<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI KP 玩家</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1 id="title">AI KP</h1>
    <span id="me" class="muted"></span>
    <span id="status" class="badge">连接中…</span>
  </header>
  <p id="notice" class="notice" hidden></p>

  <main class="layout play">
    <section class="col center">
      <ol id="log" class="log"></ol>
      <div id="choices" class="choices" hidden></div>
      <form id="message-form" class="composer play-composer">
        <textarea id="msg-text" rows="4" maxlength="6000" placeholder="写下你的角色要做什么、说什么。例如：我蹲下来仔细看地板上的划痕，然后问房东这间屋子以前住的是谁。" required></textarea>
        <div class="composer-bar">
          <span class="muted small">不用报技能和骰子，AI 会判断要不要检定 · 场外话用括号或 ooc: 开头 · Ctrl+Enter 发送</span>
          <span id="msg-count" class="muted small"></span>
          <button id="send" type="submit">发送</button>
        </div>
      </form>
    </section>

    <aside class="col right">
      <section id="story-box" hidden>
        <h3>故事简介</h3>
        <div id="story"></div>
      </section>
      <section>
        <h3>当前</h3>
        <div id="state" class="muted">—</div>
      </section>
      <section>
        <h3>前情提要</h3>
        <div id="summaries" class="muted">尚无</div>
      </section>
      <section>
        <h3>我的角色卡</h3>
        <p id="sheet-hint" class="muted small"></p>
        <textarea id="sheet" rows="8" spellcheck="false"></textarea>
        <div class="row">
          <button id="sheet-example" type="button">填入示例</button>
          <button id="sheet-save" type="button">保存角色卡</button>
        </div>
      </section>
    </aside>
  </main>
  <script src="/play.js" type="module"></script>
</body>
</html>
